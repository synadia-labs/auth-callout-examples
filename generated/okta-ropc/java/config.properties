nats.url=nats://localhost:4222
nats.service.user=auth
nats.service.password=auth
auth.signing.key.seed=REPLACE_WITH_SA_SEED
auth.default.account=APP
auth.password.backend=okta

# Okta / Auth0 configuration
# For Okta:  okta.domain=https://your-org.okta.com  token.path=/oauth2/v1/token
# For Auth0: okta.domain=https://your-tenant.auth0.com  token.path=/oauth/token
okta.domain=https://your-org.okta.com
okta.client.id=REPLACE_WITH_CLIENT_ID
okta.client.secret=REPLACE_WITH_CLIENT_SECRET
okta.scopes=openid profile email
okta.token.path=/oauth2/v1/token
