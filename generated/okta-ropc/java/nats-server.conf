# NATS AuthCallout — Okta ROPC backend
# Identical NATS topology to kv-store; only the auth handler differs.

server_name: authcallout-okta-ropc-server
port: 4222
http_port: 8222

accounts {
  SYS: { users: [ { user: sys, password: sys } ] }
  AUTH: {
    jetstream: true
    users: [ { user: auth, password: auth } ]
  }
  APP: { jetstream: true }
}

system_account: SYS

authorization {
  auth_callout {
    issuer: "REPLACE_WITH_AUTH_ACCOUNT_SIGNING_KEY_PUBLIC"
    account: AUTH
    auth_users: [ auth ]
  }
}
