include resolver.conf

port: 4222

system_account: SYS

authorization {
  auth_callout {
    issuer:   REPLACE_WITH_AUTH_ACCOUNT_PUBLIC_KEY  # nsc describe account AUTH -> Account ID
    accounts: [APP1]
    auth_users: [auth]
    # default_sentinel: REPLACE_WITH_SENTINEL_JWT   # optional: nsc describe user -a AUTH -n sentinel --raw
  }
}

leafnodes {
  listen: 0.0.0.0:7422
}
