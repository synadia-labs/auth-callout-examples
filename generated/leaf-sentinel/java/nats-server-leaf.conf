# =============================================================================
# NATS Leaf Node — connects to the hub using NKey only.
# The hub applies default_sentinel and the LeafSentinelAuthCalloutService
# verifies the nonce signature and validates the NKey against auth-nkeys.
#
# Generate a leaf NKey seed with:  nk -gen server
# Put the seed below, then add the public key to the auth-nkeys KV bucket.
# =============================================================================

server_name: leaf-node
port: 4223
http_port: 8223

leafnodes {
    remotes = [
        {
            url: "nats-leaf://localhost:7422"
            # Leaf NKey seed (SU...) — generated with: nk -gen server
            nkey: "REPLACE_WITH_LEAF_NKEY_SEED"
        }
    ]
}
