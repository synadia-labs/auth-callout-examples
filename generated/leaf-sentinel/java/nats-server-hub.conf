# =============================================================================
# NATS Hub — Leaf Node + default_sentinel AuthCallout
#
# Leaf nodes connect to this hub using only an NKey seed. The hub applies
# default_sentinel and dispatches to the LeafSentinelAuthCalloutService,
# which verifies the Ed25519 nonce signature (sole key-possession enforcer
# when the bearer sentinel is active) then checks the NKey in the KV whitelist.
#
# Run setup.sh first to generate operator/accounts and resolver.conf.
# =============================================================================

server_name: hub-authcallout
port: 4222
http_port: 8222

include resolver.conf

jetstream { domain: "HUB" }

# Bearer JWT applied to any client/leaf connecting without credentials.
# Get this value from: nsc describe user -a AUTH -n sentinel --raw
default_sentinel: "REPLACE_WITH_SENTINEL_JWT"

# Leaf node listener
leafnodes {
    listen: 0.0.0.0:7422
}
