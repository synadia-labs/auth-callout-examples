# =============================================================================
# NATS AuthCallout — KV Store password backend
# Scenario 1: client username/password validated against a NATS KV bucket.
#
# Prerequisites:
#   1. Generate a signing NKey pair:  nk -gen account
#      - Public key (A...) goes in the `issuer` field below
#      - Seed    (SA...) goes in config.properties as auth.signing.key.seed
#   2. Start server:  nats-server -c nats-server.conf
#   3. Run setup.sh to create the KV bucket and add test users
#   4. Start the AuthCallout service
# =============================================================================

server_name: authcallout-kv-server
port: 4222
http_port: 8222

debug: false
trace: false

accounts {
  SYS: {
    users: [ { user: sys, password: sys } ]
  }
  AUTH: {
    jetstream: true
    users: [
      { user: auth, password: auth }
    ]
  }
  APP: {
    jetstream: true
  }
}

system_account: SYS

authorization {
  auth_callout {
    # Public key of the account signing NKey (A...) generated with: nk -gen account
    issuer: "REPLACE_WITH_AUTH_ACCOUNT_SIGNING_KEY_PUBLIC"
    account: AUTH
    auth_users: [ auth ]
  }
}
