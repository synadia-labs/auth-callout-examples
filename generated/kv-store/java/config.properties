# =============================================================================
# AuthCallout Service Configuration — KV Store scenario
# =============================================================================

# NATS server URL
nats.url=nats://localhost:4222

# Credentials the AuthCallout service uses to connect (bypasses auth callout)
nats.service.user=auth
nats.service.password=auth

# Signing NKey seed (SA...) — generated with: nk -gen account
# The corresponding public key (A...) must be set as `issuer` in nats-server.conf
auth.signing.key.seed=REPLACE_WITH_SA_SEED

# NATS account where authenticated users are placed
auth.default.account=APP

# Password backend: kv | mysql | okta
auth.password.backend=kv

# KV bucket name — key=username, value=SHA-256 hex of password
kv.bucket.name=auth-users
