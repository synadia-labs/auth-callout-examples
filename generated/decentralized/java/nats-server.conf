# =============================================================================
# NATS AuthCallout — Decentralized (operator/accounts with nsc + default_sentinel)
#
# This config uses a NATS resolver — account JWTs are resolved from the dir or
# memory resolver generated by nsc.
#
# Run setup.sh first to generate the operator/accounts/users with nsc and to
# produce resolver.conf. Then start the server with this file.
# =============================================================================

server_name: authcallout-decentralized
port: 4222
http_port: 8222
debug: false
trace: false

# Generated by: nsc generate config --mem-resolver --sys-account SYS > resolver.conf
# Copy resolver.conf to this directory before starting.
include resolver.conf

jetstream { domain: "HUB" }

# Bearer JWT applied automatically to any connecting client that has no credentials.
# Generated by setup.sh and printed at the end.
# Replace the value below with the output of:
#   nsc describe user -a AUTH -n sentinel --raw
default_sentinel: "REPLACE_WITH_SENTINEL_JWT"
