# =============================================================================
# AuthCallout Service Configuration — Decentralized scenario
# Fill in the values printed by setup.sh
# =============================================================================

nats.url=nats://localhost:4222
auth.password.backend=kv
kv.bucket.name=auth-users

# ── Decentralized AuthCallout ─────────────────────────────────────────────────

# Path to the AUTH account service user .creds file (generated by setup.sh)
auth.decentralized.service.creds=REPLACE_WITH_PATH_TO_auth.creds

# Path to the AUTH account signing key .nk file (generated by nsc)
# Find it under: $NSC_HOME/keys/A/<public-key-prefix>/<pubkey>.nk
auth.decentralized.signing.key.path=REPLACE_WITH_PATH_TO_signing_key.nk

# AUTH account public key (printed by setup.sh)
auth.decentralized.issuer.account=REPLACE_WITH_AUTH_ACCOUNT_PUBLIC_KEY

# APP1 account public key (printed by setup.sh)
auth.decentralized.default.account=REPLACE_WITH_APP1_ACCOUNT_PUBLIC_KEY

# ── NKey Authentication (Scenario C — NKey challenge-response) ───────────────
auth.decentralized.nkey.enabled=true
auth.decentralized.nkey.bucket=auth-nkeys

# Explicit sentinel creds (Scenario A only — comment out for default_sentinel)
# auth.decentralized.sentinel.creds=REPLACE_WITH_PATH_TO_sentinel.creds
