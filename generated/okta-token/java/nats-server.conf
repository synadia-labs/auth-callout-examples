# NATS AuthCallout — Okta Token Introspection backend
# Clients connect with an Okta access token (auth_token in CONNECT options).
# Same NATS topology as other centralized scenarios.

server_name: authcallout-okta-token-server
port: 4222
http_port: 8222

accounts {
  SYS: { users: [ { user: sys, password: sys } ] }
  AUTH: {
    jetstream: true
    users: [ { user: auth, password: auth } ]
  }
  APP: { jetstream: true }
}

system_account: SYS

authorization {
  auth_callout {
    issuer: "REPLACE_WITH_AUTH_ACCOUNT_SIGNING_KEY_PUBLIC"
    account: AUTH
    auth_users: [ auth ]
  }
}
