# =============================================================================
# AuthCallout Service Configuration — MySQL scenario
# =============================================================================

nats.url=nats://localhost:4222
nats.service.user=auth
nats.service.password=auth

# Signing NKey seed (SA...) — generate with: nk -gen account
auth.signing.key.seed=REPLACE_WITH_SA_SEED
auth.default.account=APP
auth.password.backend=mysql

# MySQL connection
mysql.url=jdbc:mysql://localhost:3306/authcallout_db
mysql.user=root
mysql.password=REPLACE_WITH_DB_PASSWORD
mysql.query=SELECT password_hash FROM users WHERE username = ?
