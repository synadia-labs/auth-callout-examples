# =============================================================================
# NATS AuthCallout — MySQL password backend
# Scenario 2: client username/password validated against a MySQL table.
#
# NATS server config is identical to the KV Store scenario.
# Only the handler and config.properties differ.
#
# Prerequisites:
#   1. Generate a signing NKey pair:  nk -gen account
#      - Public key (A...) → issuer field below
#      - Seed    (SA...) → config.properties auth.signing.key.seed
#   2. Set up MySQL — run setup.sql
#   3. Start server, then service
# =============================================================================

server_name: authcallout-mysql-server
port: 4222
http_port: 8222

accounts {
  SYS: {
    users: [ { user: sys, password: sys } ]
  }
  AUTH: {
    jetstream: true
    users: [
      { user: auth, password: auth }
    ]
  }
  APP: {
    jetstream: true
  }
}

system_account: SYS

authorization {
  auth_callout {
    issuer: "REPLACE_WITH_AUTH_ACCOUNT_SIGNING_KEY_PUBLIC"
    account: AUTH
    auth_users: [ auth ]
  }
}
