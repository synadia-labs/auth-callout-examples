# ─────────────────────────────────────────────────────────────────────────────
# Synadia AuthCallout Service – Decentralized NKey scenario configuration
# Scenario: client authenticates via NKey challenge-response (no user/pass)
# Server uses default_sentinel to route client to auth callout service.
# Auth callout service validates the client NKey against a KV whitelist.
# ─────────────────────────────────────────────────────────────────────────────

# ── NATS Server ──────────────────────────────────────────────────────────────
nats.url=nats://localhost:4222


# ── Password Authentication Backend ──────────────────────────────────────────
# Which backend to use for username/password authentication.
# Valid values: kv | mysql | okta
#auth.password.backend=okta
#auth.password.backend=mysql
#auth.password.backend=kv

# ── MySQL Backend ─────────────────────────────────────────────────────────────
mysql.url=jdbc:mysql://localhost:3306/b2_test_db
mysql.user=root
mysql.password=password
mysql.query=SELECT password_hash FROM users_authcallout WHERE username = ?

# ── Okta Backend ─────────────────────────────────────────────────────────────
okta.domain=https://dev-b2-synadia.us.auth0.com
okta.client.id=EcUvfTWZIl3ubi3grjgvTrELKFAUGWYc
okta.client.secret=e4P8vsmDmkU1stWESuTzIcLryacDung1cOYaCxiRSoTm2NTWrmQObn_z_nJhE6Oj
okta.scopes=openid profile email
okta.token.path=/oauth/token
okta.introspect.path=/oauth/introspect

# ── Decentralized AuthCallout ─────────────────────────────────────────────────

# Service connection — auth user in AUTH account (bypasses auth callout)
auth.decentralized.service.creds=/Users/brunobaloi/Synadia/Synadia_Projects/CodeRepository/Java/synadia-authcallout-service/NATS/nsc_local_repo/creds/AuthCalloutOperator/AUTH/auth.creds

# AUTH account signing key (loaded from .nk file)
auth.decentralized.signing.key.path=/Users/brunobaloi/Synadia/Synadia_Projects/CodeRepository/Java/synadia-authcallout-service/NATS/nsc_local_repo/keys/A/A2/AA2MWFD4S2OZF4V3AUU3VQMJGBG6VY36UIHRQUNW27LYQ6YHNO5SBDWP.nk

# AUTH account public key — issuer_account for JWTs signed with the signing key
auth.decentralized.issuer.account=AAHN6BYPGW3YAUDN25LOQJDGXKBM6PBW54ERO54FHX62KEFTKY4Y7DJ5

# APP1 account public key — where authenticated users are placed
auth.decentralized.default.account=AB3LHREBLCDOW4HRQ6LNU7T3LROFRJYLPHQ2WTZAPYAKDDJIKIYVBK2S

# No sentinel creds — server applies default_sentinel bearer JWT automatically
#auth.decentralized.sentinel.creds=

# ── NKey Authentication ───────────────────────────────────────────────────────
# Enable NKey authentication path in the auth callout service
auth.decentralized.nkey.enabled=true

# KV bucket containing the NKey whitelist (key=NKey public key, value=any)
auth.decentralized.nkey.bucket=auth-nkeys

# NKey seed for the demo client (public key: UBGUVJY43PHN4TRLB7TJWEKYOQ2F5FITC7C7IF6NR3INRPRST5IVPCFF)
auth.decentralized.nkey.seed=SUAFCRWBPYVYRR3IXWW3MXMXFTX7GONF6OHLIOZS3BBZYYHKD7CYBZG34A
