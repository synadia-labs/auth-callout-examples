# ─────────────────────────────────────────────────────────────────────────────
# Synadia AuthCallout Service – Configuration
# Copy this file to config.properties and fill in your values.
# ─────────────────────────────────────────────────────────────────────────────

# ── NATS Server ──────────────────────────────────────────────────────────────
nats.url=nats://localhost:4222

# Credentials the AuthCallout service itself uses to connect to NATS.
# The NATS server must trust these credentials (e.g. via the auth-callout conf).
nats.service.user=auth
nats.service.password=auth

# ── Signing Key ───────────────────────────────────────────────────────────────
# Account NKey seed used to sign AuthorizationResponse JWTs.
# Generate with: nsc generate nkey --account
# Example (DO NOT use in production):
auth.signing.key.seed=SAAOAX42M4RNHBXZZ6NHYAIOVH7YFRRXED3TGKZIYK2DMF2BBJFER2VIAY

# ── XKey (Curve25519 decryption) ──────────────────────────────────────────────
# Set this to the private seed (SX...) corresponding to the public xkey configured
# in the NATS server auth_callout block.  Leave blank (or omit) for plain (unencrypted)
# auth callout payloads.
auth.xkey.seed=
#auth.xkey.seed=SXANUOZ6YEQJ3PFHB7MFXWON4N7INBZAOW446V4372SGM4OVXMMW4RXJWM

# Default NATS account to assign authenticated users to.
auth.default.account=APP

# ── Password Authentication Backend ──────────────────────────────────────────
# Which backend to use for username/password authentication.
# Valid values: kv | mysql | okta
#auth.password.backend=okta
auth.password.backend=mysql
#auth.password.backend=kv


# ── KV Store Backend ──────────────────────────────────────────────────────────
# NATS KV bucket name.  Entries: key=username, value=SHA-256(password) in hex.
kv.bucket.name=auth_bucket

# ── MySQL Backend ─────────────────────────────────────────────────────────────
# JDBC connection URL, credentials, and the prepared-statement query used to
# fetch the stored password hash for a given username.
# Expected table structure:
#   CREATE TABLE users (
#       username     VARCHAR(255) PRIMARY KEY,
#       password_hash VARCHAR(64) NOT NULL   -- SHA-256 hex
#   );
mysql.url=jdbc:mysql://localhost:3306/b2_test_db
mysql.user=root
mysql.password=password
mysql.query=SELECT password_hash FROM users_authcallout WHERE username = ?

# ── Okta Backend ─────────────────────────────────────────────────────────────
# Used for Scenario 3 (username/password → Okta ROPC) and
#           Scenario 4 (JWT token → Okta introspection).
#okta.domain=https://your-org.okta.com
okta.domain=https://dev-b2-synadia.us.auth0.com
okta.client.id=EcUvfTWZIl3ubi3grjgvTrELKFAUGWYc
okta.client.secret=e4P8vsmDmkU1stWESuTzIcLryacDung1cOYaCxiRSoTm2NTWrmQObn_z_nJhE6Oj
# OAuth2 scopes requested during ROPC flow (space-separated).
okta.scopes=openid profile email
okta.token.path=/oauth/token
okta.introspect.path=/oauth/introspect

######=========decentralized authentication========
# determine whetehr to use defaul_sentinel or not - set TRUE to use
auth.decentralized.nkey.enabled=false
auth.decentralized.service.creds=/Users/brunobaloi/Synadia/Synadia_Projects/CodeRepository/Java/synadia-authcallout-service/NATS2/nsc_local_repo_2/creds/AuthCalloutOperator/AUTH/auth.creds
# Path to the AUTH account signing key .nk file (seed is read from file, not stored here)
auth.decentralized.signing.key.path=/Users/brunobaloi/Synadia/Synadia_Projects/CodeRepository/Java/synadia-authcallout-service/NATS2/nsc_local_repo_2/keys/A/BG/ABGJS63T755HMAVVK73AXEAIHLBKFSRHJPAI3IB74YEZ7QUP4CKJ6DFA.nk
# AUTH account public key — issuer_account for response and user JWTs signed with signing key
