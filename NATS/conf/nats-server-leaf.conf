# =============================================================================
# NATS Server — Leaf Node configuration
#
# This leaf server connects to the Hub using only an NKey seed — no JWT,
# no credentials file. The Hub applies default_sentinel automatically and
# routes the leaf's auth request to the LeafSentinelAuthCalloutService.
#
# The auth callout service:
#   1. Verifies the Ed25519 nonce signature (sole key-possession enforcer)
#   2. Looks up the NKey in the auth-nkeys KV whitelist
#   3. Issues a user JWT placing the leaf into the APP1 account
#
# Replace the nkey value below with your leaf node's NKey seed (SU...).
# =============================================================================

server_name: leaf-node
port: 4223
http_port: 8223

leafnodes {
    remotes = [
        {
            url: "nats-leaf://localhost:7422"
            # Leaf authenticates to the Hub with NKey challenge-response only.
            # The Hub substitutes default_sentinel and calls out to the auth service.
            nkey: "SUAFCRWBPYVYRR3IXWW3MXMXFTX7GONF6OHLIOZS3BBZYYHKD7CYBZG34A"
        }
    ]
}
