# =============================================================================
# NATS Server — Hub for Leaf Node + default_sentinel AuthCallout scenario
#
# Same as nats-server-decentralized.conf but with a leafnode listener on
# port 7422 so leaf nodes can dial in.
#
# Leaf nodes connect with only an NKey seed (no JWT). The server applies
# default_sentinel and dispatches to the LeafSentinelAuthCalloutService,
# which verifies the Ed25519 nonce signature and validates the NKey against
# the auth-nkeys KV whitelist.
#
# Requires: nats-server >= 2.11.4
# =============================================================================

include resolver.conf

server_name: hub_auth_callout_server

http_port: 8222
debug: true
trace: true

jetstream {
  domain: "HUB"
}

# Bearer JWT applied automatically to any client/leaf that connects without credentials.
default_sentinel: "eyJ0eXAiOiJKV1QiLCJhbGciOiJlZDI1NTE5LW5rZXkifQ..cBFGiHgFbZ0eXR9elip373mAdJ-ULVdYR068yBTvcy6bWypu41vkdoreJZej5pgt7b3ga5OFBBFCRIGmvtcFDA"

# Leaf node listener — leaf servers dial this port
leafnodes {
    listen: 0.0.0.0:7422
}
