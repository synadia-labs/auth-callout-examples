# =============================================================================
# NATS Server — Decentralized AuthCallout with default_sentinel (operator mode)
#
# Clients connect with NO credentials — the server automatically applies the
# default_sentinel bearer JWT, routing them to the AuthCallout service.
# The callout service then validates the actual credentials (user/pass or NKey)
# from the CONNECT message's user/pass fields.
#
# Requires: nats-server >= 2.11.4 (default_sentinel merged 2025-04-16)
# =============================================================================

include resolver.conf

server_name: auth_callout_server_test

http_port: 8222
debug: true
trace: true

jetstream {
  domain: "HUB"
}

# Bearer JWT applied automatically to clients that connect with no credentials.
# Generated with: nsc add user --account AUTH --name default_sentinel --deny-pubsub ">" --bearer
# Extract JWT with: awk '/BEGIN NATS USER JWT/{found=1;next}/END NATS USER JWT/{found=0}found' default_sentinel.creds
default_sentinel: "eyJ0eXAiOiJKV1QiLCJhbGciOiJlZDI1NTE5LW5rZXkifQ..cBFGiHgFbZ0eXR9elip373mAdJ-ULVdYR068yBTvcy6bWypu41vkdoreJZej5pgt7b3ga5OFBBFCRIGmvtcFDA"
