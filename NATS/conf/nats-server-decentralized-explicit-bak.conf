# =============================================================================
# NATS Server — Decentralized AuthCallout configuration (explicit sentinel)
# Scenario 1: client presents sentinel .creds file + username/password
#
# No default_sentinel is configured. Clients MUST explicitly present the
# sentinel .creds file alongside their real credentials. The sentinel .creds
# file (AUTH account user JWT + NKey seed) is distributed to clients out-of-band.
#
# Prerequisites (generate with nsc) — same as nats-server-decentralized.conf
# except the sentinel user does NOT need to be a bearer token here, since
# clients load and present it directly via .authHandler(Nats.credentials(...)).
#
#   1. nsc add operator <OperatorName>
#   2. nsc add account AUTH
#   3. nsc add account APP
#   4. nsc add user -a AUTH callout
#   5. nsc add user -a AUTH sentinel --deny-pubsub ">"
#      (bearer flag NOT required when clients present it explicitly)
#   6. nsc generate creds -a AUTH -n sentinel > sentinel.creds
#      (distribute sentinel.creds to clients — configured via auth.decentralized.sentinel.creds)
#   7. nsc generate config --mem-resolver
# =============================================================================
include resolver.conf
# Operator JWT issued by nsc

#operator: <OPERATOR_JWT>

# In-memory resolver with pre-loaded account JWTs
#resolver: MEMORY
resolver: FULL

resolver_preloads: {
   AUTH account (replace with output from: nsc describe account AUTH --raw)
  <AUTH_ACCOUNT_PUBLIC_KEY>: "<AUTH_ACCOUNT_JWT>"

   APP account (replace with output from: nsc describe account APP --raw)
  <APP_ACCOUNT_PUBLIC_KEY>: "<APP_ACCOUNT_JWT>"
}

authorization {
  auth_callout {
    # Public key of the AUTH account
    issuer: <AUTH_ACCOUNT_PUBLIC_KEY>

    # NKey public key(s) of the AuthCallout service user(s)
    auth_users: [ <AUTH_CALLOUT_SERVICE_USER_NKEY> ]

    # Account the AuthCallout service connects on
    account: AUTH

    # No default_sentinel — clients must present sentinel .creds explicitly
  }
}

# Optional: enable JetStream for the KV store used by the AuthCallout service
jetstream: enabled

# Standard server settings
port: 4222
